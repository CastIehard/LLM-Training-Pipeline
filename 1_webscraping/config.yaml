# Web Scraper Configuration

# File containing URLs to scrape (one URL per line)
url_file: "1_webscraping/url.txt"

# Scraping settings
scraping:
  # Crawl depth: 0 = only URLs from file, 1 = also links found on those pages, etc.
  max_depth: 1
  
  # Only scrape English sites
  english_only: false
  
  # Request timeout in seconds
  timeout: 3
  
  # Delay between requests in seconds (to be polite)
  delay: 0.01
  
  # Maximum concurrent requests
  concurrent_requests: 3
  
  # Maximum concurrent requests per domain
  concurrent_requests_per_domain: 5
  
  # Number of retry attempts for failed requests
  retry_times: 3
  
  # User agent string (identifies as educational research bot)
  user_agent: "Mozilla/5.0 (compatible; UTN-ResearchBot/1.0; +https://utn.de; University Project)"
  
  # URL patterns to skip (case-insensitive, matches anywhere in URL)
  # Links containing these strings won't be followed
  url_blacklist:
    # Legal / Privacy (Expanded)
    - "compliance"
    - "transparenz"
    - "copyright"
    - "urheberrecht"
    - "trademark"
    - "markenrecht"
    - "licenses"
    - "lizenzen"
    - "end-user-license-agreement"
    - "eula"

    # Shopping / E-commerce (Expanded)
    - "shipping"
    - "versand"
    - "delivery"
    - "lieferung"
    - "returns"
    - "retoure"
    - "refund"
    - "rueckerstattung"
    - "track-order"
    - "sendungsverfolgung"
    - "empty-cart"

    # Social / Sharing (Expanded)
    - "google.com"
    - "google.de"
    - "maps.google"
    - "consent"

    # File Extensions (Binary & Media - Save Bandwidth)
    - ".doc"
    - ".docx"
    - ".xls"
    - ".xlsx"
    - ".ppt"
    - ".pptx"
    - ".zip"
    - ".rar"
    - ".tar"
    - ".gz"
    - ".7z"
    - ".exe"
    - ".dmg"
    - ".apk"
    - ".iso"
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".svg"
    - ".webp"
    - ".bmp"
    - ".ico"
    - ".mp3"
    - ".mp4"
    - ".avi"
    - ".mov"
    - ".wav"
    - ".css"
    - ".js"
    - ".json"
    - ".xml"
    - ".csv"
    - ".txt"

    # Tracking & Session IDs (Prevent Duplicate Content)
    - "utm_source"
    - "utm_medium"
    - "utm_campaign"
    - "gclid"
    - "fbclid"
    - "msclkid"
    - "sessionid"
    - "phpsessid"
    - "jsessionid"
    - "sid="
    - "aff_id"
    - "referrer"
    - "ref="
    - "source="
    - "clickid"
    - "token"

    # Sorting & Filters (Prevent Infinite Crawl Loops)
    - "?sort="
    - "sortierung"
    - "orderby"
    - "?order="
    - "direction="
    - "?dir="
    - "?limit="
    - "?view="
    - "?mode="
    - "display="
    - "ansicht"
    - "grid"
    - "list"
    - "filter"
    - "price-min"
    - "price-max"
    - "preis-von"
    - "preis-bis"
    - "per_page"
    - "pro_seite"
    - "recent"
    - "popular"
    - "beliebt"

    # CMS / Technical / Hidden
    - "wp-includes"
    - "wp-content"
    - "wp-json"
    - "/themes/"
    - "/plugins/"
    - "/modules/"
    - "cdn-cgi"
    - ".git"
    - ".env"
    - "composer.json"
    - "package.json"
    - "changelog"
    - "readme"
    - "license.txt"
    - "install"
    - "setup"
    - "config"
    - "preview"
    - "vorschau"
    - "debug"

    # Modals / Popups / Partial Content
    - "popup"
    - "modal"
    - "overlay"
    - "lightbox"
    - "gallery"
    - "galerie"
    - "zoom"
    - "quickview"
    - "druckansicht"
    - "print-view"
    - "mobile-app"
    - "app-download"
    - "qr-code"

    # Legal / Privacy pages (German & English)
    - "impressum"
    - "datenschutz"
    - "cookie"
    - "gdpr"
    
    # Login / Account
    - "login"
    - "logout"
    - "signout"
    - "sign-out"
    - "password"
    - "passwort"
    
    # Shopping / E-commerce
    - "cart"
    - "warenkorb"
    - "checkout"
    - "kasse"
    - "basket"
    - "wishlist"

    # Social / Sharing
    - "/tweet"
    - "facebook.com"
    - "twitter.com"
    - "linkedin.com"
    - "instagram.com"
    - "pinterest.com"
    - "youtube.com"
    - "tiktok.com"
    
    # Admin / System
    - "wp-admin"
    - "wp-login"
    - "admin"
    - "cgi-bin"
    - "/api/"
    - "/feed"
    - "/rss"
    - "xmlrpc"
    
    # Print / Export versions
    - "print"
    - "drucken"
    - "pdf-download"
    - "export"
    
    # Search / Filters
    - "search"
    - "suche"
    - "?s="
    - "?q="
    - "query"
    
    # Pagination / Archives (often duplicate content)
    - "/page/"
    - "/seite/"
    - "?page="
    - "/archive"
    - "/archiv"
    - "/tag/"
    - "/tags/"
    - "/category/"
    - "/kategorie/"
    - "/author/"
    - "/autor/"
    
    # Comments
    - "comment"
    - "kommentar"
    - "#comments"
    - "#respond"
    
    # Newsletter / Subscription
    - "subscribe"
    - "unsubscribe"
    - "abonnieren"
    - "subscription"
    
    # Other
    - "sitemap"
    - "404"
    - "error"
    - "ads"
    - "werbung"
    - "advertisement"
    - "affiliate"

# Output settings
output:
  # Directory for markdown output files
  output_dir: "data/raw_md"
  
  # Directory for HTML cache
  cache_dir: "1_webscraping/cache"
  
  # Name of the JSON index file
  index_file: "data/index.json"

# Data Cleaning Configuration for LLM Preprocessing

# Input/Output Paths
index_file: "data/index.json"
raw_md_dir: "data/raw_md"
cleaned_md_dir: "data/cleaned_md"

# --- Text Normalization & Regex (Added based on transcript) ---
# Prevents the model from learning common typos, bad spacing, and boilerplate
text_normalization:
  enabled: true
  fix_punctuation_spacing: true  # Fixes "word , word" -> "word, word" (mentioned in transcript)
  remove_boilerplate: true
  custom_regex_replacements:
    # Removes standard copyright sentences that over-occur in web data (LLaMA 3 example)
    - pattern: "(?i)copyright © \\d{4}.*all rights reserved\\.?"
      replacement: ""
    - pattern: "(?i)terms of service and privacy policy"
      replacement: ""
    # Fix spaces before commas
    - pattern: "\\s+,"
      replacement: ","
    # Remove markdown abbreviation definitions (*[ABBR]: Full text)
    - pattern: "^\\*\\[.+?\\]:.*$"
      replacement: ""
    # Remove "Back to top" navigation lines
    - pattern: "(?i)^\\s*back to top\\s*$"
      replacement: ""

# --- Markdown Cleaning (moved from 1_webscraping pipeline) ---
# Cleans raw markdown output: removes URLs, emails, junk, navigation, normalises whitespace
markdown_cleaning:
  enabled: true
  # Replace markdown links [text](url) with just text, then remove standalone URLs
  remove_urls: true
  # Remove email addresses from text
  remove_emails: false
  # Remove all markdown images like ![alt](url) and ![](path "title")
  remove_images: true
  # Remove common boilerplate / junk lines
  remove_junk_patterns: true
  junk_patterns:
    - "(?i)(skip to (main )?content|jump to navigation)"
    - "(?i)(cookie policy|privacy policy|terms of service|terms and conditions)"
    - "(?i)(subscribe to (our )?newsletter)"
    - "(?i)(follow us on|share on social media)"
    - "(?i)(copyright|©)\\s*\\d{4}"
    - "(?i)(all rights reserved)"
  # Remove navigation-menu bullet lines (lines matching '* text')
  remove_navigation_menus: true
  # Normalise whitespace: collapse spaces, limit blank lines, strip trailing/leading whitespace
  normalize_whitespace: true

# --- Harmful Content Detection ---
harmful_content:
  enabled: true
  # Documents containing these keywords (case-insensitive) will be flagged and removed.
  keywords:
    - "how to make a bomb"
    - "how to manufacture drugs"
    - "self-harm instructions"
    - "suicide methods"
    - "how to hack into"
    - "exploit vulnerability"
    - "build a weapon"
    - "incite violence"
    - "terrorist propaganda"
    - "buy illegal drugs"

# --- Offensive Language & Slang Detection ---
# The transcript notes that models mimic data: "if you feed it slangs, it will learn to generate slangs."
offensive_language:
  enabled: true
  keywords:
    - "nigger"
    - "nigga"
  filter_slangs: true
  slang_keywords:
    - "finna"
    - "gonna"
    - "lemme"
    - "wanna"
    - "ain't"

# --- PII (Personally Identifiable Information) Removal ---
# Matches are replaced with redaction placeholders like [EMAIL], [PHONE], etc.
# Expanded to address the lecture's warning about leaking info of "actual individuals".
pii_removal:
  enabled: true
  patterns:
    email: true
    phone: false           # Keep phone numbers — LLM needs contact info
    ip_address: true
    iban: true
    credit_card: true
    social_security_number: true
    passport_number: false   # Keep — could be reference codes, too many false positives
    physical_address: false  # Keep addresses — LLM needs location info

# --- Length Filtering ---
# Documents outside this character range are removed to prevent weight imbalance.
length_filter:
  enabled: true
  min_length: 200       # Skips useless 1-sentence metadata shards
  max_length: 100000    # Ensure highly dense, balanced documents

# --- Deduplication ---
# Removes documents that are too similar, reducing overfitting.
deduplication:
  enabled: true
  method: "minhash"     # Options: "minhash" or "bloom"

  minhash:
    num_perm: 128       # Number of permutation functions (higher = more accurate, slower)
    threshold: 0.85     # Increased to 0.85 to avoid accidentally deleting slightly similar but distinct texts
    shingle_size: 5     # Number of words per shingle (5-gram is standard for NLP)

  bloom:
    expected_items: 1000000 # Increased to handle large-scale web crawled data
    false_positive_rate: 0.01
    shingle_size: 5
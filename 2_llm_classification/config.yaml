# LLM Classification Configuration

# LLM Provider Settings
llm:
  # Provider: "openai" or "local" (LM Studio)
  provider: "openai"
  
  # OpenAI API settings (used when provider: "openai")
  openai:
    api_key: "${OPENAI_API_KEY}"  # Use environment variable
    model: "gpt-4.1-nano-2025-04-14"
    temperature: 0.0
    max_tokens: 50
  
  # Local LLM settings (used when provider: "local")
  # LM Studio runs a local server compatible with OpenAI API format
  local:
    base_url: "http://localhost:1234/v1"
    model: "local-model"  # LM Studio uses this as placeholder
    temperature: 0.0
    max_tokens: 50

# Classification Categories
# Each URL will be assigned to exactly one of these categories
categories:
  - name: "UTN"
    description: "Content directly related to UTN (University of Technology Nuremberg)"
  - name: "Deutschland"
    description: "General information about Germany (laws, government, nationwide services)"
  - name: "Nuernberg"
    description: "Information specific to Nuremberg city (local services, events, places)"
  - name: "Studium"
    description: "General study-related content (university life, student services, education)"
  - name: "Trash"
    description: "Unreadable, corrupted, empty, or nonsensical content (gibberish, broken encoding, no useful text)"
  - name: "Sonstiges"
    description: "Content that doesn't fit into the other categories"

# Classification Prompt
# The {categories}, {url}, and {content} placeholders will be replaced at runtime
prompt: |
  Classify the following webpage into exactly ONE category based on the URL and content.
  
  Categories:
  {categories}
  
  URL: {url}
  
  Content (first 50 lines):
  {content}
  
  Respond with ONLY the category name, nothing else.

# Data paths
data:
  index_file: "data/index.json"
  raw_md_dir: "data/raw_md"

# Processing settings
processing:
  # Delay between API calls in seconds
  delay: 0.5
  # Retries are handled via tenacity with exponential backoff
  # Set OPENAI_MAX_RETRIES env var to override default (2)

# Second Pass Filtering Settings
second_pass:
  enabled: true
  prompt: |
    <system>
    You are a quality filter for an FAQ bot helping international students coming to study at UTN in Nuremberg, Germany. 
    Your goal is to KEEP useful, general questions, and REMOVE broken, ambiguous, or highly irrelevant questions.
    </system>

    <instructions>
    Evaluate the Q&A pair and output EXACTLY "relevant" (to keep) or "irrelevant" (to remove). 
    Do NOT output any other text.

    WHEN TO KEEP ("relevant"):
    - General, helpful info for students living in Nuremberg or Germany (housing, visas, insurance, banking).
    - General information about local attractions, public transport, or student life.
    - Explicitly mentions UTN or is a clear, standalone question about studying or living in Nuremberg/Germany.

    WHEN TO REMOVE ("irrelevant"):
    - Missing Context: The question uses vague terms like "this university", "the image", "the logo", "the document", or "here". The user won't know what these refer to without the original document.
    - Too Specific / Niche: Asks about highly specific, transient local events (e.g., a specific children's reading on a specific date) that are useless to a university student.
    - Wrong University: Focuses on other specific universities (e.g., TU Munich, FAU, LMU).
    - Broken/Garbage text.
    </instructions>

    <examples>
    Q: "What degrees are available at this university?" -> irrelevant (ambiguous "this university")
    Q: "What does the logo in the image represent?" -> irrelevant (refers to "the image")
    Q: "When is the Lesung für Kinder on April 19, 2026?" -> irrelevant (too specific, irrelevant to university students)
    Q: "What kind of events does the planetarium host besides children's shows?" -> relevant (good general info about city attractions)
    Q: "How do I apply for public health insurance in Germany?" -> relevant (important student info)
    </examples>

    <qna_pair>
    Question: {question}
    Answer: {answer}
    </qna_pair>

    Decision:
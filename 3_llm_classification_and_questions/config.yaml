# LLM Classification and Q&A Generation Configuration
# This step combines classification and Q&A generation into a single LLM call.
# The LLM decides if a document is relevant, then generates Q&A pairs if so.

# LLM Provider Settings
llm:
  # Provider: "openai" or "local" (LM Studio)
  provider: "local"

  # OpenAI API settings (used when provider: "openai")
  openai:
    api_key: "${OPENAI_API_KEY}"  # Use environment variable
    model: "gpt-4.1"
    temperature: 0.1
    max_tokens: 5000

  # Local LLM settings (used when provider: "local")
  # LM Studio runs a local server compatible with the OpenAI API format
  local:
    base_url: "http://localhost:1234/v1"
    model: "qwen/qwen3-30b-a3b-2507"
    temperature: 0.1
    max_tokens: 5000

# Question Generation Settings
generation:
  # Number of content characters per question (e.g. 1000 → 1 question per 1000 chars)
  content_length_per_question: 1000

  # Variance applied around the calculated question count (±)
  question_range: 3

  # Hard limits on questions per document
  min_questions: 1
  max_questions: 20

# Combined Classification and Q&A Prompt
# Placeholders replaced at runtime: {num_questions_min}, {num_questions_max}, {content}
prompt: |
 You are an expert document analyzer for a University Q&A system. Your task is to evaluate the provided document's relevance and extract question-answer pairs if it meets the criteria.

  ### STEP 1: RELEVANCE CHECK
  Analyze the document to determine if it is RELEVANT or IRRELEVANT.

  A document is RELEVANT if its primary focus is:
  - UTN (University of Technology Nuremberg) specifically.
  - Nuremberg city (local services, public transport, housing, events, places).
  - Germany in general (laws, healthcare, banking, official student services).
  - Studying in Germany or at UTN (enrollment, courses, student life, visas, accommodation).

  A document is IRRELEVANT if it focuses on:
  - Other universities (e.g., TU Munich, FAU, LMU, TU Berlin) — EXCLUDE these even if they are located in Germany.
  - Topics with no clear connection to UTN, Nuremberg, Germany, or university studies.
  - Corrupted, empty, or meaningless text.

  ### STEP 2: OUTPUT GENERATION
  Based on your relevance check, strictly follow one of the two output formats below. Do not include explanations, reasoning, or conversational filler.

  IF IRRELEVANT:
  Output exactly this single word and absolutely nothing else:
  irrelevant

  IF RELEVANT:
  Output ONLY a valid JSON object. Do NOT wrap the JSON in markdown code blocks (e.g., no ```json). The JSON must follow this exact schema:
  {{
    "category": "<category>",
    "qa_pairs":[
      {{
        "question": "<English question based on the text>",
        "answer": "<English answer based on the text>"
      }}
    ]
  }}

  ### JSON CONSTRAINTS (IF RELEVANT):
  1. "category" MUST be exactly one of: UTN, Germany, Nuremberg, Studies.
  2. Generate between {num_questions_min} and {num_questions_max} distinct question-answer pairs.
  3. Both "question" and "answer" MUST be written in English, even if the source document is in German.

  <document>
  {content}
  </document>

  Your response (irrelevant or raw JSON only):

# Data paths
data:
  index_file: "data/index.json"
  raw_md_dir: "data/cleaned_md"
  output_file: "data/llm_qna.jsonl"

# Processing settings
processing:
  # Delay between API calls in seconds (0 = no delay; OpenAI handles rate limits internally)
  delay: 0

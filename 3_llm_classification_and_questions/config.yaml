# LLM Classification and Q&A Generation Configuration
# This step combines classification and Q&A generation into a single LLM call.
# The LLM decides if a document is relevant, then generates Q&A pairs if so.

# LLM Provider Settings
llm:
  # Provider: "openai" or "local" (LM Studio)
  provider: "local"

  # OpenAI API settings (used when provider: "openai")
  openai:
    api_key: "${OPENAI_API_KEY}"  # Use environment variable
    model: "gpt-4.1-nano"
    temperature: 0.1
    max_tokens: 5000

  # Local LLM settings (used when provider: "local")
  # LM Studio runs a local server compatible with the OpenAI API format
  local:
    base_url: "http://localhost:1234/v1"
    model: "openai/gpt-oss-20b"
    temperature: 0.1
    max_tokens: 5000

# Question Generation Settings
generation:
  # Number of content characters per question (e.g. 1000 → 1 question per 1000 chars)
  content_length_per_question: 1000

  # Variance applied around the calculated question count (±)
  question_range: 3

  # Hard limits on questions per document
  min_questions: 1
  max_questions: 20

# Combined Classification and Q&A Prompt
# Placeholders replaced at runtime: {num_questions_min}, {num_questions_max}, {content}
prompt: |
  <system>
  You are an expert document analyzer for a University Q&A system. Your task is to evaluate the provided document's relevance and extract question-answer pairs if it meets the criteria.
  </system>

  <instructions>
  ### STEP 1: RELEVANCE CHECK
  Determine if the document is RELEVANT or IRRELEVANT.

  RELEVANT topics:
  - UTN (University of Technology Nuremberg) specifically.
  - Nuremberg city (local services, public transport, housing, events, places).
  - Germany in general (laws, healthcare, banking, official student services).
  - Studying in Germany or at UTN (enrollment, courses, student life, visas, accommodation).

  IRRELEVANT topics:
  - Other universities (e.g., TU Munich, FAU, LMU, TU Berlin). EXCLUDE these.
  - Topics with no clear connection to the RELEVANT topics above.
  - Corrupted, empty, or meaningless text.

  ### STEP 2: OUTPUT GENERATION
  If the document is IRRELEVANT, output exactly the word "irrelevant" and absolutely nothing else.

  If the document is RELEVANT, output ONLY a valid JSON object. Do NOT wrap the JSON in markdown code blocks.
  Schema:
  {{
    "category": "UTN" | "Germany" | "Nuremberg" | "Studies",
    "qa_pairs": [
      {{
        "question": "<English question>",
        "answer": "<English answer>"
      }}
    ]
  }}

  JSON CONSTRAINTS:
  1. Generate between {num_questions_min} and {num_questions_max} distinct question-answer pairs.
  2. Both "question" and "answer" MUST be written in English.
  3. The "question" MUST be a realistic user query that can be directly answered using the document.
  4. The "answer" MUST successfully answer that question using ONLY the provided document.
  5. Each question MUST be standalone and understandable by itself without prior context. Do not use ambiguous pronouns (e.g., instead of "When is it open?", use "When is the XYZ museum open?").
  Example: If the document is about applying for BAföG, a good question could be "Who is responsible for BAföG in Nuremberg?" and the answer would be "It is the Studierendenwerk Erlangen-Nürnberg."
  </instructions>

  <document>
  {content}
  </document>

  Output (irrelevant or valid JSON only):

# Data paths
data:
  index_file: "data/index.json"
  raw_md_dir: "data/cleaned_md"
  output_file: "data/llm_qna.jsonl"

# Processing settings
processing:
  # Delay between API calls in seconds (0 = no delay; OpenAI handles rate limits internally)
  delay: 0

# Filtering settings

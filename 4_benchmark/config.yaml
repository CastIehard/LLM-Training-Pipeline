# Benchmark Configuration

# Answer LLM Settings (the model being tested)
answer_llm:
  # Provider: "openai", "local" (LM Studio), or "huggingface" (local model)
  provider: "huggingface"
  
  # OpenAI API settings
  openai:
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-4.1-nano"
    temperature: 0.3
    max_tokens: 512
  
  # Local LLM settings (LM Studio)
  local:
    base_url: "http://localhost:1234/v1"
    model: "local-model"
    temperature: 0.3
    max_tokens: 512

  # HuggingFace model settings (downloaded/cached locally)
  huggingface:
    # Model name from HuggingFace Hub (e.g., "Qwen/Qwen3-0.6B")
    model: "Qwen_Qwen3-0.6B-cpt1e-6-SFT-GEPA"
    # Local directory to cache models
    model_dir: "model"
    # Device: "auto", "cpu", "cuda", "mps"
    device: "auto"
    # Dtype: "auto", "float16", "float32", "bfloat16"
    dtype: "auto"
    temperature: 0.3
    max_tokens: 1024

# Judge LLM Settings (evaluates the answers)
judge_llm:
  # Provider: "openai" or "local" (LM Studio)
  # Note: huggingface not recommended for judge (slower, less reliable JSON output)
  provider: "local"
  
  # OpenAI API settings
  openai:
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-4.1-nano"
    temperature: 0.0
    max_tokens: 512
  
  # Local LLM settings (LM Studio)
  local:
    base_url: "http://localhost:1234/v1"
    model: "qwen/qwen3.5-9b"
    temperature: 0.0
    max_tokens: 512

# Benchmark Settings
benchmark:
  # Number of questions per category to sample
  questions_per_category: 50 #note that "reference faq" has only 13 questions.
  categories: [ ]

# System prompt for the answer LLM
answer_system_prompt: |
  Answer questions factually and concisely about German bureaucracy, student regulations, insurance, visas, and local services.
  Limit responses to one or two short sentences (under 25 words).
  **Do not emit reasoning blocks, CoT, thinking traces, or any content before/after your answer.**
  **Never hallucinate** dates, office names, visa types, legal acts, or requirements—answer only what you know with high confidence.
  When in doubt between bureaucratic processes (e.g., visa entry vs. residence registration), distinguish them precisely; do not conflate. 
  If information is unavailable, state it clearly without fabricating details.
  Output ONLY the answer text within your final message.

# Answer Prompt (sent to the answer LLM)
answer_prompt: |
  {question}

# Judge Prompt (sent to the judge LLM)
judge_prompt: |
  You are an expert evaluator. Your task is to compare an AI's answer with an expected correct answer.

  Question: {question}
  Expected Answer: {expected_answer}
  AI's Answer: {ai_answer}

  Grading Rubric:
  - 1.0: The AI answer is fully accurate and covers all main points of the expected answer.
  - 0.5: The AI answer is partially correct, or missing some key information, or includes significant irrelevant info.
  - 0.0: The AI answer is completely wrong, irrelevant, hallucinates info not in the expected answer, or is truncated/incomplete.

  Think step by step about:
  1. What essential facts are in the expected answer
  2. Which of those facts are present in the AI answer
  3. Whether the AI answer is incomplete, truncated, irrelevant, or hallucinatory
  4. What the final score should be

  Your response MUST be a single complete valid JSON object with exactly this structure:
  {{
    "reasoning": "<brief step-by-step reasoning>",
    "score": <number: 0, 0.5, or 1>,
    "reason": "<one sentence summary of the score>"
  }}

  Do not output markdown.
  Do not output code fences.
  Do not output any text before or after the JSON.
  Ensure the JSON is complete and not truncated.

# Data paths
data:
  qna_file: "data/llm_qna.jsonl"
  # Benchmark file will be named benchmark_{n}.jsonl based on questions_per_category
  benchmark_file: "4_benchmark/benchmark.jsonl"
  results_dir: "4_benchmark/results"

# Processing settings
processing:
  delay: 0
  answer_batch_size: 16
  judge_batch_size: 4
  answer_max_workers: 1
  judge_max_workers: 1

# Benchmark Configuration

# Answer LLM Settings (the model being tested)
answer_llm:
  # Provider: "openai", "local" (LM Studio), or "huggingface" (local model)
  provider: "huggingface"
  
  # OpenAI API settings
  openai:
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-4.1-nano"
    temperature: 0.3
    max_tokens: 500
  
  # Local LLM settings (LM Studio)
  local:
    base_url: "http://localhost:1234/v1"
    model: "local-model"
    temperature: 0.3
    max_tokens: 500

  # HuggingFace model settings (downloaded/cached locally)
  huggingface:
    # Model name from HuggingFace Hub (e.g., "Qwen/Qwen3-0.6B")
    model: "Qwen_Qwen3-0.6B-SFT-v1"
    # Local directory to cache models
    model_dir: "model"
    # Device: "auto", "cpu", "cuda", "mps"
    device: "auto"
    # Dtype: "auto", "float16", "float32", "bfloat16"
    dtype: "auto"
    temperature: 0.3
    max_tokens: 500

# Judge LLM Settings (evaluates the answers)
judge_llm:
  # Provider: "openai" or "local" (LM Studio)
  # Note: huggingface not recommended for judge (slower, less reliable JSON output)
  provider: "local"
  
  # OpenAI API settings
  openai:
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-4.1-nano"
    temperature: 0.0
    max_tokens: 100
  
  # Local LLM settings (LM Studio)
  local:
    base_url: "http://localhost:1234/v1"
    model: "openai/gpt-oss-20b"
    temperature: 0.0
    max_tokens: 100

# Benchmark Settings
benchmark:
  # Number of questions per category to sample
  questions_per_category: 50
  
  # Categories to include (leave empty for all)
  # categories: ["UTN", "Germany", "Nuremberg", "Studies", "Other"]
  categories: []

# Answer Prompt (sent to the answer LLM)
answer_prompt: |
  {question}

# Judge Prompt (sent to the judge LLM)
judge_prompt: |
  You are an expert evaluator. Your task is to compare an AI's answer with an expected (correct) answer.
  
  Question: {question}
  Expected Answer: {expected_answer}
  AI's Answer: {ai_answer}
  
  Grading Rubric:
  - 1.0: The AI answer is fully accurate and covers all main points of the expected answer.
  - 0.5: The AI answer is partially correct, or missing some key information, or includes significant irrelevant info.
  - 0.0: The AI answer is completely wrong, irrelevant, or hallucinates info not in the expected answer.
  
  Think step-by-step about what parts of the expected answer are present and what might be incorrect.
  Summarize your thinking and then provide the final score.
  
  Your response MUST be a JSON object with this exact structure:
  {{
    "reasoning": "<your step-by-step thinking here>",
    "score": <number (0, 0.5, or 1)>,
    "reason": "<one sentence summary of the score>"
  }}
  Ensure the JSON is complete and well-formatted. Do not truncate.

# Data paths
data:
  qna_file: "data/llm_qna.jsonl"
  # Benchmark file will be named benchmark_{n}.jsonl based on questions_per_category
  benchmark_file: "4_benchmark/benchmark.jsonl"
  results_dir: "4_benchmark/results"

# Processing settings
processing:
  delay: 0

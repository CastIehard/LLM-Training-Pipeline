model: "../model/Qwen_Qwen3-0.6B"

train: true
data: "./data"

fine_tune_type: dora

adapter_path: "./adapters/domain_adapter_v2"

optimizer: adamw
seed: 42

# Wir erhoehen num_layers auf 28 (alle Layer des Qwen-0.6B Modells), 
# damit sich das Wissen im kompletten Netz verankern kann.
num_layers: 28 

batch_size: 4
grad_accumulation_steps: 4

iters: 3000

lr_schedule:
  name: cosine_decay
  warmup: 200
  warmup_init: 1e-6
  arguments: [1e-5, 3000] # [max_lr, total_iters]

max_seq_length: 1024
grad_checkpoint: true

val_batches: 50

steps_per_report: 10
steps_per_eval: 100
save_every: 100

lora_parameters:
  keys:
    - self_attn.q_proj
    - self_attn.v_proj
    - self_attn.k_proj
    - self_attn.o_proj
    - mlp.gate_proj
    - mlp.up_proj
    - mlp.down_proj
  rank: 64
  scale: 128.0
  dropout: 0.05

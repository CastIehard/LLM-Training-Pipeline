model: "../model/Qwen_Qwen3-0.6B"

train: true
data: "./data"

fine_tune_type: lora
adapter_path: "./adapters/domain_adapter"

optimizer: adamw
seed: 42

num_layers: -1   # or full layer count if your mx-lm version needs an integer

batch_size: 4
grad_accumulation_steps: 16

iters: 4800
learning_rate: 5e-5

max_seq_length: 1024
grad_checkpoint: true # set false if memory allows and you want more speed

val_batches: 50

steps_per_report: 10
steps_per_eval: 100
save_every: 100

lora_parameters:
  keys:
    - self_attn.q_proj
    - self_attn.k_proj
    - self_attn.v_proj
    - self_attn.o_proj
  rank: 16
  scale: 32.0
  dropout: 0.05
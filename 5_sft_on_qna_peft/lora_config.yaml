model: "../model/Qwen_Qwen3-0.6B"

train: true
data: "./data"

fine_tune_type: lora

adapter_path: "./adapters/domain_adapter"

optimizer: adamw
seed: 42

num_layers: 16

batch_size: 4
grad_accumulation_steps: 4

iters: 1200
learning_rate: 1e-5

max_seq_length: 1024
grad_checkpoint: true

val_batches: 50

steps_per_report: 10
steps_per_eval: 100
save_every: 100

lora_parameters:
  keys:
    - self_attn.q_proj
    - self_attn.v_proj
  rank: 8
  scale: 20.0
  dropout: 0.0
